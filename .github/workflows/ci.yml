name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-deployment
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DB_ENGINE: django.db.backends.sqlite3
      DB_NAME: ci.sqlite3

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Check schema and configuration
        run: |
          ruff check . --select F,E9
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py check
      - name: Run tests
        run: |
          python -m pytest tests -q
          python manage.py test apps.test_platform.tests --verbosity 1
